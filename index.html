<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>地下街室內導航系統</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6f9; /* 更柔和的背景色 */
        --panel: #ffffff;
        --line: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --accent: #0f766e;
        --blue: #3b82f6;
        --blue-hover: #2563eb;
        --danger: #ef4444;
        --route: #146c63;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        letter-spacing: 0.3px;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea {
        font: inherit;
        color: inherit;
      }
      
      /* 🌟 整體版面佈局 */
      .app {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      
      /* 🌟 頂部導覽列 (加入柔和陰影) */
      .topbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
        background: var(--panel);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        border-radius: 0 0 20px 20px;
        position: relative;
        z-index: 10;
      }
      .brand {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
      }
      .brand span {
        background: #e0f2fe;
        color: #0369a1;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }
      
      /* 🌟 輸入框與按鈕的現代化 */
      input, select, textarea {
        width: 100%;
        min-height: 44px;
        border: 2px solid transparent;
        background: #f1f5f9;
        border-radius: 12px;
        padding: 0 16px;
        outline: none;
        transition: all 0.25s ease;
      }
      input:focus, select:focus, textarea:focus {
        background: #fff;
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      }
      button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 0 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background: #f8fafc;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px);
      }
      
      /* 🌟 主視覺按鈕 (漸層與光暈) */
      .primary {
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--blue-hover));
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }
      .primary:hover {
        background: linear-gradient(135deg, #4f8cf6, #1d4ed8);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        color: #fff;
      }
      
      /* 🌟 地圖區域 */
      .map-shell {
        position: relative;
        min-height: 460px;
        overflow: hidden;
        background: #e2e8f0; /* 底圖載入前的顏色 */
      }
      .map-shell.navigation-start canvas { animation: mapStartPulse 0.9s ease-out; }
      .map-shell.navigation-end canvas { animation: mapEndFade 0.65s ease-out; }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      
      /* 🌟 浮動控制面板 (毛玻璃 Glassmorphism 特效) */
      .floor-switch, .map-tools, .status-chip {
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        border-radius: 14px;
      }
      .status-chip {
        left: 16px;
        right: 16px;
        top: 16px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        color: var(--text);
        font-weight: 500;
        font-size: 14px;
      }
      #dataStatus { color: var(--muted); font-size: 13px; }
      
      .floor-switch { left: 16px; top: 80px; display: grid; gap: 4px; padding: 6px; }
      .map-tools { right: 16px; top: 80px; display: grid; gap: 4px; padding: 6px; }
      
      /* 浮動工具按鈕修飾 */
      .floor-switch button, .map-tools button {
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        background: transparent;
        border-radius: 10px;
        color: var(--text);
      }
      .floor-switch button:hover, .map-tools button:hover { background: rgba(0, 0, 0, 0.05); }
      .floor-switch button.active, .map-tools button.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      }
      
      /* 導航提示橫幅 */
      .nav-flash {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0;
        pointer-events: none;
        padding: 16px 24px;
        border-radius: 50px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .nav-flash.show { animation: flashInOut 1.25s ease both; }
      
      /* 🌟 底部資訊板 (抽屜式設計) */
      .sheet {
        background: var(--panel);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.06);
        border-radius: 24px 24px 0 0;
        padding: 24px 16px calc(16px + env(safe-area-inset-bottom));
        position: relative;
        z-index: 10;
      }
      /* 抽屜頂部的拉柄裝飾 */
      .sheet::before {
        content: '';
        display: block;
        width: 40px;
        height: 5px;
        background: #cbd5e1;
        border-radius: 10px;
        margin: -10px auto 16px;
      }
      
      .next-step { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: var(--text); }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      .meta span {
        background: #f1f5f9;
        padding: 6px 12px;
        border-radius: 8px;
        color: var(--muted);
      }
      #destinationText { color: var(--blue); background: #eff6ff; }
      
      .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      
      /* 🌟 搜尋結果清單 */
      .results {
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        margin-top: 16px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }
      .result {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.2s ease;
      }
      .result:last-child { border-bottom: none; }
      .result:hover { background: #f8fafc; }
      .result strong { font-size: 16px; color: var(--text); }
      .result span { display: inline-block; margin-top: 4px; }
      
      /* 評價按鈕修飾 */
      .result button.primary {
        background: #fff;
        color: var(--blue);
        border: 1px solid var(--blue);
        box-shadow: none;
      }
      .result button.primary:hover {
        background: var(--blue);
        color: #fff;
      }
      
      .privacy {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 16px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .privacy input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue); }
      
      /* 🌟 彈窗設計 (Dialog) */
      dialog {
        border: none;
        border-radius: 20px;
        padding: 24px;
        width: min(420px, calc(100vw - 32px));
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        color: var(--text);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      dialog h2 { margin: 0 0 16px 0; font-size: 20px; color: var(--text); }
      .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
      
      /* 大螢幕優化 (Desktop) */
      @media (min-width: 900px) {
        .app { width: min(1180px, 100%); margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        .topbar {
          grid-template-columns: minmax(360px, 1fr) minmax(260px, auto);
          border-radius: 0;
        }
        .map-shell { min-height: 680px; }
        .sheet {
          border-left: 1px solid var(--line);
          border-right: 1px solid var(--line);
          border-radius: 24px 24px 0 0;
        }
        .sheet::before { display: none; }
      }
      
      @keyframes flashInOut {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        25% { transform: translate(-50%, -50%) scale(1); }
        85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      }
      @keyframes mapStartPulse {
        0% { filter: saturate(1); }
        40% { filter: saturate(1.2) contrast(1.05); }
        100% { filter: saturate(1); }
      }
      @keyframes mapEndFade {
        0% { opacity: 1; }
        35% { opacity: 0.6; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>地下街室內導航系統</h1>
          <span>用戶端</span>
        </div>
        <div class="search">
          <input
            id="searchInput"
            type="search"
            placeholder="輸入地點、設施或分類"
          /><button id="searchButton" class="primary">搜尋</button>
        </div>
        <select id="mapSelect" aria-label="選擇地圖"></select>
      </header>

      <main class="map-shell">
        <canvas id="mapCanvas"></canvas>
        <div class="status-chip">
          <span id="floorLabel">樓層</span
          ><span id="dataStatus">讀取資料中</span>
        </div>
        <div id="navFlash" class="nav-flash">開始導航</div>
        <div id="floorButtons" class="floor-switch"></div>
        <div class="map-tools">
          <button id="relocateButton">跟隨</button>
          <button id="pointModeButton">顯示</button>
          <button id="zoomInButton">+</button>
          <button id="zoomOutButton">-</button>
          <button id="resetButton">2D</button>
          <button id="gridOverlayButton">網格</button>
        </div>
      </main>

      <section class="sheet">
        <p id="nextStep" class="next-step">
          請搜尋目的地，或從結果中選擇地點。
        </p>
        <div class="meta">
          <span id="destinationText">目的地：尚未選擇</span
          ><span id="distanceText">距離：-- 公尺</span
          ><span id="timeText">時間：-- 分鐘</span
          ><span id="headingText" hidden></span>
        </div>
        <div class="actions">
          <button id="showRouteButton">顯示路線</button
          ><button id="startButton" class="primary">開始導航</button
          ><button id="endButton">結束導航</button>
        </div>
        <div id="results" class="results" hidden></div>
        <label class="privacy"
          ><span
            >協助改善定位：匿名上傳必要定位狀態，不包含姓名或個人身分資料。</span
          ><input id="feedbackSwitch" type="checkbox"
        /></label>
      </section>
    </div>

    <dialog id="privacyDialog">
      <h2>定位資料說明</h2>
      <p>
        系統可在取得同意後，匿名上傳導航過程中的 Wi-Fi
        訊號與定位狀態，用於改善定位準確度，不包含姓名、電話或個人身分資料。
      </p>
      <div class="dialog-actions">
        <button id="declinePrivacy">不同意</button
        ><button id="acceptPrivacy" class="primary">同意</button>
      </div>
    </dialog>

    <!-- 🌟 新增：商店評價彈窗介面 -->
    <dialog id="reviewDialog" style="max-width: 500px; width: 90%;">
      <h2 id="reviewPlaceName" style="margin-top: 0;">商店名稱</h2>
      
      <!-- 顯示所有評價的地方 -->
      <div id="reviewsContainer" style="max-height: 250px; overflow-y: auto; background: #f9fafb; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
        <div style="text-align: center; color: var(--muted);">載入評論中...</div>
      </div>

      <!-- 讓使用者新增評價 -->
      <div style="border-top: 1px solid var(--line); padding-top: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">給予星級：</label>
        <select id="reviewStar" style="margin-bottom: 10px; padding: 8px;">
          <option value="5">⭐⭐⭐⭐⭐ (5星 - 超讚)</option>
          <option value="4">⭐⭐⭐⭐ (4星 - 很好)</option>
          <option value="3">⭐⭐⭐ (3星 - 普通)</option>
          <option value="2">⭐⭐ (2星 - 待加強)</option>
          <option value="1">⭐ (1星 - 極差)</option>
        </select>
        
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">你的評論：</label>
        <textarea id="reviewText" placeholder="寫下你的體驗與評價..." style="width: 100%; height: 80px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; outline: none;"></textarea>
      </div>

      <div class="dialog-actions" style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
        <button onclick="document.getElementById('reviewDialog').close()">關閉</button>
        <button onclick="submitReview()" class="primary">送出評價</button>
      </div>
    </dialog>

    

    <script>
      const state = {
  maps: [],
  floors: [],
  places: [],
  wifiPoints: [],
  floorImages: new Map(),
  currentMapId: "map_visual_3",
  currentFloorId: "k-floor-grid",
  // 🌟 將起點強制設在 K 區的「西廣場」走道上，確保它在畫布可見範圍內
  current: { x: 53, y: 62, gridX: 5, gridY: 4, floorId: "k-floor-grid" },
  heading: null,
  destination: null,
        route: [],
        routeDistance: 0,
        routeTime: 0,
        zoom: 1,
        viewOffsetX: 0,
        viewOffsetY: 0,
        viewFollow: false,
        pointDisplayMode:
          localStorage.getItem("pointDisplayMode") || "important",
        dragStart: null,
        viewFocusedKey: "",
        showGridOverlay: false,
        navigationActive: false,
        navigationFrame: null,
        feedbackAllowed: localStorage.getItem("feedbackAllowed") === "true",
      };
      // 🎯 你的直覺解法：打破錯誤的比例，建立精準的「網格對應真實畫布」對照表
      // 🎯 真實比例校正引擎 (X 軸)
      function getGridPixelX(gridX) {
          const xMap = {
              2: 15, 3: 35, 5: 53, 7: 88, 8: 95, 10: 115, 12: 144, 13: 148,
              14: 157, 15: 165, 18: 180, 19: 195, 20: 215, 21: 216, 22: 228,
              23: 245, 24: 250, 25: 261, 26: 270, 27: 280, 28: 295, 29: 305,
              30: 317, 31: 340, 32: 343, 33: 355, 34: 370
          };
          if (xMap[gridX] !== undefined) return xMap[gridX];
          // 縫隙自動內插
          const keys = Object.keys(xMap).map(Number).sort((a,b)=>a-b);
          for(let i=0; i<keys.length-1; i++){
              if(gridX > keys[i] && gridX < keys[i+1]){
                  const p = (gridX - keys[i]) / (keys[i+1] - keys[i]);
                  return xMap[keys[i]] + p * (xMap[keys[i+1]] - xMap[keys[i]]);
              }
          }
          return gridX * 10;
      }

      // 🎯 真實比例校正引擎 (Y 軸：絕對純白避障區)
      function getGridPixelY(gridY) {
          if (gridY === 2) return 42; // 🟢 上排走道 (完美避開寶雅 35 與 Hobby OFF 48)
          if (gridY === 3) return 52; // 🟢 垂直通道
          if (gridY === 4) return 62; // 🟢 下排走道 (完美避開 Hobby OFF 48 與大創 76)
          return gridY * 10;
      }
      const canvas = document.querySelector("#mapCanvas");
      const ctx = canvas.getContext("2d");
      const mapShell = document.querySelector(".map-shell");
      const navFlash = document.querySelector("#navFlash");
      const mapSelect = document.querySelector("#mapSelect");
      const searchInput = document.querySelector("#searchInput");
      const results = document.querySelector("#results");
      const floorButtons = document.querySelector("#floorButtons");
      const floorLabel = document.querySelector("#floorLabel");
      const dataStatus = document.querySelector("#dataStatus");
      const nextStep = document.querySelector("#nextStep");
      const destinationText = document.querySelector("#destinationText");
      const distanceText = document.querySelector("#distanceText");
      const timeText = document.querySelector("#timeText");
      const feedbackSwitch = document.querySelector("#feedbackSwitch");
      const privacyDialog = document.querySelector("#privacyDialog");
      const compassButton = document.querySelector("#relocateButton");
      const pointModeButton = document.querySelector("#pointModeButton");
      const world = { left: 0, top: 250, width: 900, height: 480 };

      document
        .querySelector("#searchButton")
        .addEventListener("click", performSearch);
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") performSearch();
      });
      compassButton.textContent = "跟隨";
      compassButton.title = "切換跟隨模式";
      compassButton.addEventListener("click", toggleViewFollow);
      pointModeButton.title = "切換點位顯示";
      pointModeButton.addEventListener("click", cyclePointDisplayMode);
      updatePointModeButton();
      document
        .querySelector("#zoomInButton")
        .addEventListener("click", () => setZoom(state.zoom * 1.2));
      document
        .querySelector("#zoomOutButton")
        .addEventListener("click", () => setZoom(state.zoom / 1.2));
      document
        .querySelector("#resetButton")
        .addEventListener("click", resetView);
      document
        .querySelector("#gridOverlayButton")
        .addEventListener("click", () => {
          state.showGridOverlay = !state.showGridOverlay;
          drawMap();
        });
      document
        .querySelector("#showRouteButton")
        .addEventListener("click", showRoute);
      document
        .querySelector("#startButton")
        .addEventListener("click", startNavigation);
      document
        .querySelector("#endButton")
        .addEventListener("click", endNavigation);
      document
        .querySelector("#acceptPrivacy")
        .addEventListener("click", () => setFeedbackAllowed(true));
      document
        .querySelector("#declinePrivacy")
        .addEventListener("click", () => setFeedbackAllowed(false));
      feedbackSwitch.addEventListener("change", () => {
        feedbackSwitch.checked
          ? privacyDialog.showModal()
          : setFeedbackAllowed(false);
      });

      mapSelect.addEventListener("change", async () => {
        state.currentMapId = mapSelect.value;
        state.viewFocusedKey = "";
        await loadFloors();
        await loadPlaces();
        await loadWifiPoints();
        performSearch();
        renderAll();
      });
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener(
        "deviceorientationabsolute",
        handleOrientation,
        true,
      );
      window.addEventListener("deviceorientation", handleOrientation, true);
      canvas.addEventListener("pointerdown", startPan);
      canvas.addEventListener("pointermove", movePan);
      canvas.addEventListener("pointerup", endPan);
      canvas.addEventListener("pointercancel", endPan);
      canvas.addEventListener("wheel", handleWheel, { passive: false });

      init();

      async function init() {
        feedbackSwitch.checked = state.feedbackAllowed;
        if (!localStorage.getItem("feedbackConsentAsked"))
          privacyDialog.showModal();
        await loadMaps();
        await loadFloors();
        await loadPlaces();
        await loadWifiPoints();
        resizeCanvas();
        focusOnWifiPoints();
        performSearch();
        renderAll();
        startRealTimeTracking();
      }

      async function loadMaps() {
  const maps = await fetchJson("/api/maps").catch(() => []);
  state.maps = maps.length
    ? maps
    : [{ id: "tkut-demo", name: "淡江大學淡水校園 Demo" }];
  
  state.maps.push({
    id: "map_visual_3",
    name: "K區地下街 (AI 網格精準版 - Map Visual 3)",
  });

  if (!state.maps.some((map) => map.id === state.currentMapId)) {
    state.currentMapId = state.maps[0].id;
  }
  
  // 🌟 修復藍色箭頭：根據不同地圖給予正確的預設中心位置
  if (state.currentMapId === "map_visual_3") {
    state.current = { x: 180, y: 40, floorId: "k-floor-grid" };
  } else {
    state.current = { x: 180, y: 620, floorId: "tkut-demo-ground" };
  }

  mapSelect.innerHTML = state.maps
    .map(
      (map) =>
        `<option value="${escapeHtml(map.id)}">${escapeHtml(map.name || map.id)}</option>`,
    )
    .join("");
  mapSelect.value = state.currentMapId;
}
      async function loadFloors() {
        if (state.currentMapId === "map_visual_3") {
          state.floors = [
            {
              id: "k-floor-grid",
              floorName: "AI 網格層",
              imageUrl: "/maps/k_zone_map.png",  // 👈 換成這行！
              
             imageWidth: 379.06,

      async function showRoute() {
  if (!state.destination) {
    nextStep.textContent = "請先選擇目的地。";
    return;
  }
  
  try {
    const floor = currentFloor();
    // 取得圖片真實渲染尺寸與偏移量 (這是對齊的核心)
    const ox = floor.imageLeft || -4.63;
    const oy = floor.imageTop || -16.36;
    const imgW = floor.imageWidth || 379.06;
    const imgH = floor.imageHeight || 122.73;
    const cols = 75; // CSV 的 X 軸大小
    const rows = 25; // CSV 的 Y 軸大小

    // 核心公式 1：把螢幕上的像素，精確轉換成 75x25 網格的 index
    function pixelToGrid(px, py) {
      let gx = Math.floor((px - ox) / (imgW / cols));
      let gy = Math.floor((py - oy) / (imgH / rows));
      return {
        x: Math.max(0, Math.min(cols - 1, gx)),
        y: Math.max(0, Math.min(rows - 1, gy))
      };
    }

    // 核心公式 2：把後端算出來的 75x25 網格，精確轉回螢幕像素
    function gridToPixel(gx, gy) {
      return {
        x: ox + (gx + 0.5) * (imgW / cols),
        y: oy + (gy + 0.5) * (imgH / rows)
      };
    }

    // 1. 抓取藍色箭頭(目前位置)的像素座標
    const startPixelX = state.current.x;
    const startPixelY = state.current.y;

    // 2. 抓取目的地的像素座標
    const destPixelX = state.destination.visualX !== undefined ? state.destination.visualX : state.destination.x * 10 + 5;
    const destPixelY = state.destination.visualY !== undefined ? state.destination.visualY : state.destination.y * 10 + 5;

    // 3. 將起點與終點轉換為 75x25 網格座標，發給後端
    const startGrid = pixelToGrid(startPixelX, startPixelY);
    const targetGrid = pixelToGrid(destPixelX, destPixelY);

    const response = await fetch("http://127.0.0.1:8000/api/get_path", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        start_y: startGrid.y,
        start_x: startGrid.x,
        target_y: targetGrid.y,
        target_x: targetGrid.x
      }),
    });

    if (!response.ok) throw new Error("API 請求失敗");
    const routeData = await response.json();
    if (routeData.status !== "success") throw new Error(routeData.message);

    // 4. 將後端傳回的 75x25 網格路徑，用公式完美轉回螢幕像素
    state.route = (routeData.path || []).map((coord) => {
      let p = gridToPixel(coord.x, coord.y);
      return { x: p.x, y: p.y, floorId: state.currentFloorId };
    });

    // 5. 確保線的兩端完美連接藍色箭頭與店家正中心
    if (state.route.length > 0) {
      state.route.unshift({ x: startPixelX, y: startPixelY, floorId: state.currentFloorId });
      state.route.push({ x: destPixelX, y: destPixelY, floorId: state.destination.floorId });
    }
    
    state.routeDistance = (routeData.total_steps || 0) * 0.6;
    state.routeTime = Math.max(1, Math.ceil(state.routeDistance / 80));
    distanceText.textContent = `距離：${Math.round(state.routeDistance)} 公尺`;
    timeText.textContent = `時間：${state.routeTime} 分鐘`;
    nextStep.textContent = routeData.message;

  } catch (error) {
    console.error("路線取得失敗", error);
    state.route = [];
    nextStep.textContent = "❌ " + error.message; 
  }
  renderAll();
}

        if (trackingTimer) clearInterval(trackingTimer);

          try {
            const response = await fetch("http://127.0.0.1:8000/api/current-location");
            if (!response.ok) return;
            
            const positionData = await response.json();
            
            if (positionData && positionData.x !== undefined) {
              state.current.gridX = positionData.x;
              state.current.gridY = positionData.y;
              
              const floor = state.floors.find(f => f.id === state.currentFloorId) || state.floors[0];
              const ox = floor.imageLeft || 0;
              const oy = floor.imageTop || 0;
              const scaleX = 379.06 / 75;

              // 🎯 修正舊版錯誤的乘法邏輯，套用新比例並加上 ox/oy 偏移，藍點就會準確出現！
              state.current.x = ox + (positionData.x * scaleX) + (scaleX / 2);
              state.current.y = oy + (positionData.y * scaleY) + (scaleY / 2);
              
              if (positionData.floorId) {

      function drawWalkways() {

        // 依圖片實際尺寸換算格距（可在下方微調原點，讓疊圖對齊圖片）
        const cols = 37, rows = 9;

        const oy = floor.imageTop;
        ctx.save();

        GRID_DATA.forEach((rowVals, r) => {

      function baseScreen(x, y) {

        const candidates = state.places

        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);

        world.left = minX - margin;

        let height = Number(floor.imageHeight || floor.height);
        const image = state.floorImages.get(floor.imageUrl);
        const naturalWidth = Number(

        const naturalHeight = Number(

        );
        if (
          Number.isFinite(naturalWidth) &&
          Number.isFinite(naturalHeight) &&

          const naturalAspect = naturalWidth / naturalHeight;
          if (Number.isFinite(width) && width > 0) {

          } else if (Number.isFinite(height) && height > 0) {

          });

          const response = await fetch("http://127.0.0.1:8000/api/locate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ signals: realSignals }),
          });
          
          if (response.ok) {
            const data = await response.json();
            if (data.status === "success") {
              // 🎯 直接將後端回傳的網格座標對應到畫布像素，保證藍點 100% 完美現身
              state.current.gridX = data.x;
              state.current.gridY = data.y;
              
              // 使用你地圖最穩定的等比例基準 (每一格 10 像素 + 5 像素置中)
              state.current.x = (data.x * 10) + 5;
              state.current.y = (data.y * 10) + 5;
              
              if (state.navigationActive && state.destination) {
                showRoute();
              }
              if (state.viewFollow) {
                centerOnCurrent();
              }
              drawMap();
            }
          }
        } catch (error) {
          console.error("定位運算發生錯誤:", error);
        }
      };
    </script>
  </body>
</html>
