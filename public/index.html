<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>地下街室內導航系統</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f7;
      --panel: #ffffff;
      --line: #d9dee5;
      --text: #1f2933;
      --muted: #667085;
      --accent: #146c63;
      --accent-strong: #0f5b53;
      --blue: #2563eb;
      --danger: #b42318;
      --walkway: #dde4ea;
      --route: #146c63;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 12px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }
    .brand span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    #searchInput {
      min-width: 0;
    }
    input, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      cursor: pointer;
    }
    .primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }
    .map-shell {
      position: relative;
      min-height: 460px;
      overflow: hidden;
      background: #fafbfc;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .floor-switch {
      position: absolute;
      left: 12px;
      top: 76px;
      display: grid;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .floor-switch button,
    .map-tools button {
      width: 48px;
      height: 44px;
      padding: 0;
      font-weight: 600;
    }
    .floor-switch button.active {
      border-color: var(--blue);
      background: #eff6ff;
      color: #1d4ed8;
    }
    .map-tools {
      position: absolute;
      right: 12px;
      top: 76px;
      display: grid;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .status-chip {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .sheet {
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    }
    .next-step {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .results {
      max-height: 210px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      margin-top: 10px;
    }
    .result {
      width: 100%;
      display: grid;
      gap: 2px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 10px 12px;
      min-height: auto;
    }
    .result:last-child { border-bottom: 0; }
    .result strong { font-size: 15px; }
    .result span { color: var(--muted); font-size: 13px; }
    .privacy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .privacy input {
      width: auto;
      min-height: auto;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      width: min(420px, calc(100vw - 32px));
      color: var(--text);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .32); }
    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    @media (min-width: 900px) {
      .app {
        width: min(1180px, 100%);
        margin: 0 auto;
      }
      .topbar {
        grid-template-columns: minmax(360px, 1fr) minmax(260px, auto);
      }
      .map-shell { min-height: 680px; }
      .sheet {
        border: 1px solid var(--line);
        border-radius: 8px 8px 0 0;
        margin: 0 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>地下街室內導航系統</h1>
        <span>用戶端</span>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="輸入地點、設施或分類">
        <button id="searchButton" class="primary">搜尋</button>
      </div>
      <select id="mapSelect" aria-label="選擇地圖"></select>
    </header>

    <main class="map-shell">
      <canvas id="mapCanvas"></canvas>
      <div class="status-chip">
        <span id="floorLabel">地面層</span>
        <span id="dataStatus">讀取資料中</span>
      </div>
      <div id="floorButtons" class="floor-switch"></div>
      <div class="map-tools">
        <button id="relocateButton">定位</button>
        <button id="zoomInButton">+</button>
        <button id="zoomOutButton">-</button>
        <button id="resetButton">2D</button>
      </div>
    </main>

    <section class="sheet">
      <p id="nextStep" class="next-step">請搜尋目的地，或從結果中選擇地點。</p>
      <div class="meta">
        <span id="destinationText">目的地：尚未選擇</span>
        <span id="distanceText">距離：-- 公尺</span>
        <span id="timeText">時間：-- 分鐘</span>
        <span id="headingText">方向：--</span>
      </div>
      <div class="actions">
        <button id="showRouteButton">顯示路線</button>
        <button id="startButton" class="primary">開始導航</button>
        <button id="endButton">結束導航</button>
      </div>
      <div id="results" class="results" hidden></div>
      <label class="privacy">
        <span>協助改善定位：匿名上傳必要定位狀態，不包含姓名或聯絡資訊。</span>
        <input id="feedbackSwitch" type="checkbox">
      </label>
    </section>
  </div>

  <dialog id="privacyDialog">
    <h2>協助改善定位</h2>
    <p>系統可在導航過程中匿名上傳必要定位狀態，用於改善定位品質。不包含姓名、電話或個人聯絡資訊。瀏覽器版無法讀取 Wi-Fi RSSI，因此不會從網頁蒐集 Wi-Fi 指紋。</p>
    <div class="dialog-actions">
      <button id="declinePrivacy">先不要</button>
      <button id="acceptPrivacy" class="primary">同意</button>
    </div>
  </dialog>

  <script>
    const state = {
      maps: [],
      floors: [],
      places: [],
      wifiPoints: [],
      currentMapId: "tkut-demo",
      currentFloorId: "tkut-demo-ground",
      current: { x: 180, y: 620, floorId: "tkut-demo-ground" },
      heading: null,
      destination: null,
      route: [],
      routeDistance: 0,
      routeTime: 0,
      zoom: 1,
      navigationActive: false,
      feedbackAllowed: localStorage.getItem("feedbackAllowed") === "true",
    };

    const canvas = document.querySelector("#mapCanvas");
    const ctx = canvas.getContext("2d");
    const mapSelect = document.querySelector("#mapSelect");
    const searchInput = document.querySelector("#searchInput");
    const results = document.querySelector("#results");
    const floorButtons = document.querySelector("#floorButtons");
    const floorLabel = document.querySelector("#floorLabel");
    const dataStatus = document.querySelector("#dataStatus");
    const nextStep = document.querySelector("#nextStep");
    const destinationText = document.querySelector("#destinationText");
    const distanceText = document.querySelector("#distanceText");
    const timeText = document.querySelector("#timeText");
    const headingText = document.querySelector("#headingText");
    const feedbackSwitch = document.querySelector("#feedbackSwitch");
    const privacyDialog = document.querySelector("#privacyDialog");

    const world = { left: 0, top: 250, width: 900, height: 480 };

    document.querySelector("#searchButton").addEventListener("click", performSearch);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") performSearch();
    });
    document.querySelector("#relocateButton").addEventListener("click", relocate);
    document.querySelector("#zoomInButton").addEventListener("click", () => setZoom(state.zoom * 1.2));
    document.querySelector("#zoomOutButton").addEventListener("click", () => setZoom(state.zoom / 1.2));
    document.querySelector("#resetButton").addEventListener("click", () => setZoom(1));
    document.querySelector("#showRouteButton").addEventListener("click", showRoute);
    document.querySelector("#startButton").addEventListener("click", startNavigation);
    document.querySelector("#endButton").addEventListener("click", endNavigation);
    document.querySelector("#acceptPrivacy").addEventListener("click", () => setFeedbackAllowed(true));
    document.querySelector("#declinePrivacy").addEventListener("click", () => setFeedbackAllowed(false));
    feedbackSwitch.addEventListener("change", () => {
      if (feedbackSwitch.checked) {
        privacyDialog.showModal();
      } else {
        setFeedbackAllowed(false);
      }
    });
    mapSelect.addEventListener("change", async () => {
      state.currentMapId = mapSelect.value;
      await loadFloors();
      await loadPlaces();
      await loadWifiPoints();
      renderAll();
    });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("deviceorientationabsolute", handleOrientation, true);
    window.addEventListener("deviceorientation", handleOrientation, true);

    init();

    async function init() {
      feedbackSwitch.checked = state.feedbackAllowed;
      if (!localStorage.getItem("feedbackConsentAsked")) {
        privacyDialog.showModal();
      }
      await loadMaps();
      await loadFloors();
      await loadPlaces();
      await loadWifiPoints();
      resizeCanvas();
      performSearch();
      renderAll();
    }

    async function loadMaps() {
      const maps = await fetchJson("/api/maps");
      state.maps = maps.length ? maps : [{ id: "tkut-demo", name: "地下街室內導航展示場域" }];
      if (!state.maps.some((map) => map.id === state.currentMapId)) {
        state.currentMapId = state.maps[0].id;
      }
      mapSelect.innerHTML = state.maps.map((map) => `<option value="${escapeHtml(map.id)}">${escapeHtml(map.name || map.id)}</option>`).join("");
      mapSelect.value = state.currentMapId;
    }

    async function loadFloors() {
      const floors = await fetchJson(`/api/floors?mapId=${encodeURIComponent(state.currentMapId)}`);
      state.floors = floors.length ? floors : [
        { id: "tkut-demo-ground", floorName: "地面層" },
        { id: "tkut-demo-second", floorName: "二樓" },
      ];
      if (!state.floors.some((floor) => floor.id === state.currentFloorId)) {
        state.currentFloorId = state.floors[0].id;
        state.current.floorId = state.currentFloorId;
      }
      renderFloorButtons();
    }

    async function loadPlaces() {
      state.places = await fetchJson(`/api/places?mapId=${encodeURIComponent(state.currentMapId)}`);
      updateDataStatus();
    }

    async function loadWifiPoints() {
      try {
        const data = await fetchJson(`/api/wifi-scans/points?mapId=${encodeURIComponent(state.currentMapId)}&floorId=${encodeURIComponent(state.currentFloorId)}`);
        state.wifiPoints = Array.isArray(data.points) ? data.points : [];
        if (state.wifiPoints.length > 0 && !state.destination) {
          const first = state.wifiPoints[0];
          state.current = { x: Number(first.x), y: Number(first.y), floorId: first.floorId || state.currentFloorId };
        }
        updateWorldFromData();
      } catch {
        state.wifiPoints = [];
      }
      updateDataStatus();
    }

    function updateDataStatus() {
      if (state.places.length) {
        dataStatus.textContent = "已載入地點資料";
      } else if (state.wifiPoints.length) {
        dataStatus.textContent = `已載入 ${state.wifiPoints.length} 個 Wi-Fi 採樣點`;
      } else {
        dataStatus.textContent = "尚無地圖資料";
      }
    }

    function renderFloorButtons() {
      floorButtons.innerHTML = "";
      state.floors.forEach((floor, index) => {
        const button = document.createElement("button");
        button.textContent = shortFloorName(floor, index);
        button.className = floor.id === state.currentFloorId ? "active" : "";
        button.addEventListener("click", async () => {
          state.currentFloorId = floor.id;
          state.current.floorId = floor.id;
          await loadWifiPoints();
          renderAll();
        });
        floorButtons.appendChild(button);
      });
    }

    function performSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      const matched = navigationTargets()
        .filter((place) => {
          if (!keyword) return place.floorId === state.currentFloorId;
          return [place.id, place.name, place.category, place.description].some((value) => String(value || "").toLowerCase().includes(keyword));
        })
        .slice(0, 30);
      const exact = matched.find((place) => keyword && (String(place.id).toLowerCase() === keyword || String(place.name).toLowerCase() === keyword));
      if (exact) selectDestination(exact.id);
      results.hidden = matched.length === 0;
      results.innerHTML = matched.map((place) => `
        <button class="result" data-id="${escapeHtml(place.id)}">
          <strong>${escapeHtml(place.name)}</strong>
          <span>${escapeHtml(floorName(place.floorId))}｜${escapeHtml(place.category || "地點")}｜${distance(place.x, place.y, state.current.x, state.current.y).toFixed(0)} 公尺｜可導航</span>
        </button>
      `).join("");
      results.querySelectorAll(".result").forEach((button) => {
        button.addEventListener("click", () => selectDestination(button.dataset.id));
      });
      renderAll();
    }

    function selectDestination(id) {
      state.destination = navigationTargets().find((place) => place.id === id) || null;
      state.route = [];
      if (state.destination) {
        destinationText.textContent = `目的地：${state.destination.name}`;
        nextStep.textContent = `${state.destination.name} 已設為目的地。`;
        if (state.destination.floorId !== state.currentFloorId) {
          state.currentFloorId = state.destination.floorId;
          state.current.floorId = state.currentFloorId;
          renderFloorButtons();
          loadWifiPoints();
        }
      }
      showRoute();
      renderAll();
    }

    async function showRoute() {
      if (!state.destination) {
        nextStep.textContent = "請先選擇目的地。";
        return;
      }
      const body = {
        mapId: state.currentMapId,
        startFloorId: state.current.floorId,
        targetFloorId: state.destination.floorId,
        startX: state.current.x,
        startY: state.current.y,
        destinationPlaceId: state.destination.id,
      };
      try {
        if (state.destination.source === "wifiPoint") throw new Error("sampled route");
        const route = await postJson("/api/routes", body);
        state.route = (route.routePoints || []).map((point) => ({
          x: Number(point.x || 0),
          y: Number(point.y || 0),
          floorId: point.floorId || state.currentFloorId,
        }));
        state.routeDistance = Number(route.distance || 0);
        state.routeTime = Math.max(1, Number(route.estimatedTime || 1));
      } catch {
        state.route = buildLocalRoute();
        state.routeDistance = routeDistance(state.route);
        state.routeTime = Math.max(1, Math.ceil(state.routeDistance / 80));
      }
      distanceText.textContent = `距離：${Math.round(state.routeDistance)} 公尺`;
      timeText.textContent = `時間：${state.routeTime} 分鐘`;
      nextStep.textContent = nextStepText();
      renderAll();
    }

    function startNavigation() {
      if (!state.destination) {
        nextStep.textContent = "請先選擇目的地。";
        return;
      }
      state.navigationActive = true;
      nextStep.textContent = nextStepText();
      submitFeedback(false);
    }

    function endNavigation() {
      state.navigationActive = false;
      state.route = [];
      nextStep.textContent = "導航已結束。";
      submitFeedback(true);
      renderAll();
    }

    function relocate() {
      nextStep.textContent = "瀏覽器版無法讀取 Wi-Fi RSSI，暫以目前位置顯示。";
      state.current = { x: 180, y: 620, floorId: state.currentFloorId };
      renderAll();
    }

    function buildLocalRoute() {
      if (!state.destination) return [];
      const sampledRoute = sampledRouteToDestination();
      if (sampledRoute.length >= 2) return sampledRoute;
      if (state.destination.floorId !== state.current.floorId) {
        return [
          { x: state.current.x, y: state.current.y, floorId: state.current.floorId },
          { x: 250, y: 570, floorId: state.current.floorId },
          { x: 390, y: 500, floorId: state.current.floorId },
          { x: 610, y: 500, floorId: state.current.floorId },
          { x: 610, y: 500, floorId: state.destination.floorId },
          { x: 610, y: 390, floorId: state.destination.floorId },
          { x: state.destination.x, y: state.destination.y, floorId: state.destination.floorId },
        ];
      }
      return [
        { x: state.current.x, y: state.current.y, floorId: state.current.floorId },
        { x: 250, y: 570, floorId: state.current.floorId },
        { x: 390, y: 500, floorId: state.current.floorId },
        { x: state.destination.x, y: state.destination.y, floorId: state.current.floorId },
      ];
    }

    function renderAll() {
      renderFloorButtons();
      floorLabel.textContent = floorName(state.currentFloorId);
      destinationText.textContent = state.destination ? `目的地：${state.destination.name}` : "目的地：尚未選擇";
      headingText.textContent = state.heading == null ? "方向：--" : `方向：${Math.round(state.heading)}°`;
      drawMap();
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawMap();
    }

    function drawMap() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#fafbfc";
      ctx.fillRect(0, 0, rect.width, rect.height);
      drawWalkways();
      drawWifiSampleMap();
      drawRoute();
      drawPlaces();
      drawCurrent();
    }

    function drawWalkways() {
      if (state.currentMapId !== "tkut-demo") return;
      ctx.lineWidth = 28;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--walkway").trim();
      if (isSecondFloor(state.currentFloorId)) {
        drawPolyline([{ x: 610, y: 500 }, { x: 610, y: 390 }, { x: 610, y: 300 }]);
        drawPolyline([{ x: 610, y: 390 }, { x: 700, y: 390 }]);
      } else {
        drawPolyline([{ x: 120, y: 680 }, { x: 250, y: 570 }, { x: 390, y: 500 }, { x: 610, y: 500 }, { x: 790, y: 360 }]);
        drawPolyline([{ x: 390, y: 500 }, { x: 430, y: 420 }, { x: 520, y: 330 }]);
      }
    }

    function drawRoute() {
      const visible = state.route.filter((point) => !point.floorId || point.floorId === state.currentFloorId);
      if (visible.length < 2) return;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = state.destination?.source === "wifiPoint" ? 12 : 18;
      ctx.strokeStyle = "#ffffff";
      drawPolyline(visible);
      ctx.lineWidth = state.destination?.source === "wifiPoint" ? 6 : 10;
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--route").trim();
      drawPolyline(visible);
    }

    function drawPlaces() {
      ctx.font = "14px Microsoft JhengHei, sans-serif";
      ctx.textBaseline = "middle";
      state.places.filter((place) => place.floorId === state.currentFloorId).forEach((place) => {
        const point = screen(place.x, place.y);
        const selected = state.destination && state.destination.id === place.id;
        ctx.fillStyle = selected ? "#b42318" : "#55606c";
        ctx.beginPath();
        ctx.arc(point.x, point.y, selected ? 7 : 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1f2933";
        ctx.fillText(place.name, point.x + 10, point.y - 8);
      });
    }

    function drawWifiSampleMap() {
      if (state.places.some((place) => place.floorId === state.currentFloorId) || state.wifiPoints.length === 0) return;
      const points = state.wifiPoints
        .filter((point) => point.floorId === state.currentFloorId)
        .slice()
        .sort((left, right) => String(left.pointId).localeCompare(String(right.pointId), undefined, { numeric: true }));
      if (points.length === 0) return;

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#d8e0e7";
      ctx.lineWidth = 18;
      drawPolyline(points);
      ctx.strokeStyle = "#146c63";
      ctx.lineWidth = 4;
      drawPolyline(points);

      ctx.font = "12px Microsoft JhengHei, sans-serif";
      ctx.textBaseline = "middle";
      points.forEach((sample, index) => {
        const point = screen(sample.x, sample.y);
        const radius = Math.max(4, Math.min(9, Math.sqrt(Number(sample.scanCount || 1)) / 2.8));
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius + 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = index === 0 ? "#2563eb" : "#146c63";
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fill();
        if (index % 4 === 0 || points.length <= 20) {
          ctx.fillStyle = "#1f2933";
          ctx.fillText(sample.pointId, point.x + 10, point.y - 8);
        }
      });
    }

    function drawCurrent() {
      const point = screen(state.current.x, state.current.y);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(point.x, point.y, 14, 0, Math.PI * 2);
      ctx.fill();
      if (state.heading == null) {
        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const rad = state.heading * Math.PI / 180;
        const tip = { x: point.x + Math.sin(rad) * 20, y: point.y - Math.cos(rad) * 20 };
        const leftRad = rad + 140 * Math.PI / 180;
        const rightRad = rad - 140 * Math.PI / 180;
        ctx.fillStyle = "#2563eb";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        ctx.lineTo(point.x + Math.sin(leftRad) * 13, point.y - Math.cos(leftRad) * 13);
        ctx.lineTo(point.x, point.y);
        ctx.lineTo(point.x + Math.sin(rightRad) * 13, point.y - Math.cos(rightRad) * 13);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = "#1f2933";
      ctx.font = "14px Microsoft JhengHei, sans-serif";
      ctx.fillText("目前位置", point.x + 18, point.y + 4);
    }

    function drawPolyline(points) {
      ctx.beginPath();
      points.forEach((point, index) => {
        const next = screen(point.x, point.y);
        if (index === 0) ctx.moveTo(next.x, next.y);
        else ctx.lineTo(next.x, next.y);
      });
      ctx.stroke();
    }

    function screen(x, y) {
      const rect = canvas.getBoundingClientRect();
      const padding = 28;
      const sx = padding + ((x - world.left) / world.width) * (rect.width - padding * 2);
      const sy = padding + ((y - world.top) / world.height) * (rect.height - padding * 2);
      return {
        x: rect.width / 2 + (sx - rect.width / 2) * state.zoom,
        y: rect.height / 2 + (sy - rect.height / 2) * state.zoom,
      };
    }

    function updateWorldFromData() {
      const candidates = state.places
        .filter((place) => place.floorId === state.currentFloorId)
        .concat(state.wifiPoints.filter((point) => point.floorId === state.currentFloorId));
      if (candidates.length === 0) {
        world.left = 0;
        world.top = 250;
        world.width = 900;
        world.height = 480;
        return;
      }
      const xs = candidates.map((item) => Number(item.x)).filter(Number.isFinite);
      const ys = candidates.map((item) => Number(item.y)).filter(Number.isFinite);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const margin = 30;
      world.left = minX - margin;
      world.top = minY - margin;
      world.width = Math.max(60, maxX - minX + margin * 2);
      world.height = Math.max(60, maxY - minY + margin * 2);
    }

    function setZoom(value) {
      state.zoom = Math.max(0.85, Math.min(2.8, value));
      drawMap();
    }

    function handleOrientation(event) {
      const alpha = Number(event.alpha);
      if (Number.isFinite(alpha)) {
        state.heading = alpha;
        headingText.textContent = `方向：${Math.round(alpha)}°`;
        drawMap();
      }
    }

    async function submitFeedback(arrivedDestination) {
      if (!state.feedbackAllowed || !state.destination) return;
      await postJson("/api/navigation-feedback", {
        anonymousUserId: anonymousId(),
        mapId: state.currentMapId,
        floorId: state.currentFloorId,
        estimatedX: state.current.x,
        estimatedY: state.current.y,
        currentRouteId: "web-demo-route",
        nearestRouteNodeId: "web-demo",
        currentWifiList: [],
        heading: state.heading,
        stepDelta: 0,
        confidence: 35,
        estimatedError: 20,
        isOffRoute: false,
        relocalizeCount: 0,
        arrivedDestination,
        deviceInfo: navigator.userAgent,
        collectedAt: Date.now(),
      }).catch(() => {});
    }

    function nextStepText() {
      if (!state.destination) return "請搜尋目的地，或從結果中選擇地點。";
      if (state.destination.floorId !== state.current.floorId) {
        return `請先前往樓層連接點，再切換到 ${floorName(state.destination.floorId)}。`;
      }
      if (state.destination.source === "wifiPoint") {
        return `沿著採樣點路線前進，目的地是 ${state.destination.name}。`;
      }
      return `沿著路線前進，目的地是 ${state.destination.name}。`;
    }

    function navigationTargets() {
      const wifiTargets = state.wifiPoints.map((point) => ({
        id: point.pointId,
        name: point.pointId,
        mapId: point.mapId,
        floorId: point.floorId,
        category: "Wi-Fi 採樣點",
        x: Number(point.x),
        y: Number(point.y),
        description: `掃描 ${point.scanCount || 0} 筆，AP ${point.bssidCount || 0} 個`,
        searchable: true,
        businessStatus: "unset",
        source: "wifiPoint",
      }));
      return state.places.concat(wifiTargets);
    }

    function orderedWifiPoints() {
      return state.wifiPoints
        .filter((point) => point.floorId === state.currentFloorId)
        .slice()
        .sort((left, right) => String(left.pointId).localeCompare(String(right.pointId), undefined, { numeric: true }));
    }

    function sampledRouteToDestination() {
      if (!state.destination || state.destination.source !== "wifiPoint") return [];
      const points = orderedWifiPoints();
      if (points.length === 0) return [];
      const startIndex = nearestPointIndex(points, state.current);
      const endIndex = points.findIndex((point) => point.pointId === state.destination.id);
      if (startIndex < 0 || endIndex < 0) return [];
      const from = Math.min(startIndex, endIndex);
      const to = Math.max(startIndex, endIndex);
      const segment = points.slice(from, to + 1);
      const ordered = startIndex <= endIndex ? segment : segment.reverse();
      return ordered.map((point) => ({
        id: point.pointId,
        x: Number(point.x),
        y: Number(point.y),
        floorId: point.floorId,
      }));
    }

    function nearestPointIndex(points, current) {
      let bestIndex = -1;
      let bestDistance = Infinity;
      points.forEach((point, index) => {
        const nextDistance = distance(Number(point.x), Number(point.y), Number(current.x), Number(current.y));
        if (nextDistance < bestDistance) {
          bestDistance = nextDistance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function setFeedbackAllowed(allowed) {
      state.feedbackAllowed = allowed;
      feedbackSwitch.checked = allowed;
      localStorage.setItem("feedbackConsentAsked", "true");
      localStorage.setItem("feedbackAllowed", String(allowed));
      privacyDialog.close();
    }

    function floorName(id) {
      const floor = state.floors.find((item) => item.id === id);
      return floor ? (floor.floorName || floor.name || floor.id) : id;
    }

    function shortFloorName(floor, index) {
      const name = floor.floorName || floor.name || floor.id;
      if (/ground|地面|一樓|1f/i.test(`${floor.id} ${name}`)) return "1F";
      if (/second|二樓|2f|2/i.test(`${floor.id} ${name}`)) return "2F";
      return name.length <= 3 ? name : `${index + 1}F`;
    }

    function isSecondFloor(id) {
      return /second|2|二樓/i.test(`${id} ${floorName(id)}`);
    }

    function routeDistance(points) {
      return points.slice(1).reduce((sum, point, index) => sum + distance(point.x, point.y, points[index].x, points[index].y), 0);
    }

    function distance(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function anonymousId() {
      let id = localStorage.getItem("anonymousUserId");
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem("anonymousUserId", id);
      }
      return id;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;",
      }[char]));
    }
  </script>
</body>
