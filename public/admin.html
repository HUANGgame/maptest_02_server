<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地下街室內導航系統後台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --line: #d8dde3;
      --text: #1f2933;
      --muted: #657181;
      --accent: #146c63;
      --warn: #9a5b00;
      --bad: #a32929;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.5;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    main {
      display: grid;
      gap: 16px;
      grid-template-columns: 280px 1fr;
      padding: 16px;
    }
    section, aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    select, input, textarea, button {
      width: 100%;
      min-height: 38px;
      margin-top: 4px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 7px 10px;
    }
    textarea {
      min-height: 72px;
      resize: vertical;
    }
    button {
      margin-top: 12px;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .metric {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 12px;
    }
    .metric div {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .metric strong {
      display: block;
      font-size: 22px;
      color: var(--accent);
    }
    .muted { color: var(--muted); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .full { grid-column: 1 / -1; }
    .map-editor {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 260px;
      align-items: start;
    }
    .map-editor-canvas-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef1f4;
      min-height: 360px;
      overflow: hidden;
    }
    #mapEditorCanvas {
      display: block;
      width: 100%;
      height: 520px;
      cursor: crosshair;
    }
    .inline-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .inline-buttons button {
      margin-top: 0;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
    }
    button.active {
      outline: 3px solid rgba(20, 108, 99, 0.22);
    }
    .hidden { display: none; }
    .editor-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    @media (max-width: 900px) {
      main, .grid, .map-editor { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>地下街室內導航系統後台</h1>
    <div id="healthInfo" class="muted">後端：檢查中</div>
    <div id="adminNotice" class="muted">待命</div>
  </header>
  <main>
    <aside>
      <h2>查詢條件</h2>
      <label for="mapSelect">地圖</label>
      <select id="mapSelect"></select>
      <label for="floorSelect">樓層</label>
      <select id="floorSelect"></select>
      <button id="reloadButton">重新整理</button>
      <button id="exportScopeButton">匯出資料</button>

      <h2 style="margin-top:18px">新增資料</h2>
      <label for="newMapName">新增地圖名稱</label>
      <input id="newMapName" placeholder="地圖名稱">
      <button id="createMapButton">新增地圖</button>

      <label for="newFloorName">新增樓層名稱</label>
      <input id="newFloorName" placeholder="例如 B1">
      <button id="createFloorButton">新增樓層</button>

    </aside>
    <div class="grid">
      <section class="full">
        <h2>地圖編輯</h2>
        <div class="map-editor">
          <div class="map-editor-canvas-wrap">
            <canvas id="mapEditorCanvas"></canvas>
          </div>
          <div>
            <div class="inline-buttons">
              <button id="placeModeButton" class="active">標點</button>
              <button id="routeModeButton" class="secondary">畫路線</button>
              <button id="deleteNodeModeButton" class="secondary">刪節點</button>
              <button id="deleteEdgeModeButton" class="secondary">刪路線</button>
            </div>
            <button id="clearRouteDraftButton" class="secondary">清除路線暫選</button>
            <div id="mapEditorInfo" class="muted" style="margin-top:12px">點地圖後會帶入座標。</div>
            <div id="placeEditorForm" class="editor-form hidden">
              <label for="newPlaceName">名稱</label>
              <input id="newPlaceName" placeholder="例如 K12、電梯、店名">
              <label for="newPlaceCategory">分類設施</label>
              <input id="newPlaceCategory" placeholder="例如 店家、樓梯、電梯、出口">
              <label for="newPlaceKeywords">關鍵詞</label>
              <input id="newPlaceKeywords" placeholder="例如 東森 K12 出口">
              <label for="newPlaceDescription">備註</label>
              <textarea id="newPlaceDescription" placeholder="例如 靠近樓梯，往機捷方向"></textarea>
              <label for="newPlaceX">座標 X</label>
              <input id="newPlaceX" type="number" placeholder="0">
              <label for="newPlaceY">座標 Y</label>
              <input id="newPlaceY" type="number" placeholder="0">
              <button id="createPlaceButton">儲存標點</button>
            </div>
          </div>
        </div>
      </section>
      <section>
        <h2>地點資料</h2>
        <table>
          <thead><tr><th>名稱</th><th>分類</th><th>座標</th><th>狀態</th></tr></thead>
          <tbody id="placesBody"></tbody>
        </table>
      </section>
      <section>
        <h2>Wi-Fi 指紋點</h2>
        <div class="metric">
          <div><span class="muted">掃描紀錄</span><strong id="totalRecords">0</strong></div>
          <div><span class="muted">採樣點</span><strong id="pointCount">0</strong></div>
          <div><span class="muted">AP 數</span><strong id="bssidCount">0</strong></div>
        </div>
        <table>
          <thead><tr><th>點位</th><th>座標</th><th>掃描數</th><th>AP 數</th></tr></thead>
          <tbody id="pointsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>資料品質</h2>
        <table>
          <thead><tr><th>項目</th><th>結果</th><th>建議動作</th></tr></thead>
          <tbody id="qualityBody"></tbody>
        </table>
      </section>
      <section>
        <h2>障礙路段</h2>
        <table>
          <thead><tr><th>路段</th><th>距離</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody id="routeEdgesBody"></tbody>
        </table>
      </section>
      <section>
        <h2>目前範圍</h2>
        <div id="scopeInfo" class="muted"></div>
      </section>
      <section>
        <h2>匿名回饋</h2>
        <div class="metric">
          <div><span class="muted">待評估</span><strong id="pendingFeedback">0</strong></div>
          <div><span class="muted">高可信</span><strong id="highFeedback">0</strong></div>
          <div><span class="muted">拒用</span><strong id="rejectedFeedback">0</strong></div>
        </div>
        <button id="evaluateFeedbackButton">評估回饋品質</button>
        <button id="retrainFeedbackButton">回饋再訓練</button>
      </section>
      <section>
        <h2>模型版本</h2>
        <button id="trainKnnButton">訓練 KNN</button>
        <button id="trainRfButton">建立比較模型</button>
        <table>
          <thead><tr><th>版本</th><th>演算法</th><th>資料量</th><th>用途</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody id="modelsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>訓練紀錄</h2>
        <table>
          <thead><tr><th>類型</th><th>狀態</th><th>資料</th></tr></thead>
          <tbody id="jobsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>導航策略</h2>
        <button id="trainPolicyButton">策略訓練</button>
        <table>
          <thead><tr><th>回合</th><th>平均獎勵</th><th>成功率</th><th>摘要</th><th>狀態</th></tr></thead>
          <tbody id="policyRunsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>策略決策紀錄</h2>
        <table>
          <thead><tr><th>建議動作</th><th>Wi-Fi</th><th>狀態</th></tr></thead>
          <tbody id="policyLogsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>使用者回報</h2>
        <table>
          <thead><tr><th>類型</th><th>狀態</th><th>說明</th></tr></thead>
          <tbody id="reportsBody"></tbody>
        </table>
      </section>
      <section>
        <h2>路線測試</h2>
        <button id="testLibraryRouteButton">測試本樓層路線</button>
        <button id="testSecondFloorRouteButton">測試跨樓層</button>
        <div id="routeTestResult" class="muted">尚未測試</div>
      </section>
    </div>
  </main>
  <script>
    const mapSelect = document.querySelector("#mapSelect");
    const floorSelect = document.querySelector("#floorSelect");
    const reloadButton = document.querySelector("#reloadButton");
    const mapEditorCanvas = document.querySelector("#mapEditorCanvas");
    const mapEditorCtx = mapEditorCanvas.getContext("2d");
    let currentPlaces = [];
    let currentFloors = [];
    let currentPoints = [];
    let currentRouteEdges = [];
    let currentRouteNodes = [];
    let editorMode = "place";
    let routeDraft = [];
    let mapEditorImage = null;
    let mapEditorBounds = null;

    reloadButton.addEventListener("click", loadDashboard);
    document.querySelector("#placeModeButton").addEventListener("click", () => setEditorMode("place"));
    document.querySelector("#routeModeButton").addEventListener("click", () => setEditorMode("route"));
    document.querySelector("#deleteNodeModeButton").addEventListener("click", () => setEditorMode("deleteNode"));
    document.querySelector("#deleteEdgeModeButton").addEventListener("click", () => setEditorMode("deleteEdge"));
    document.querySelector("#clearRouteDraftButton").addEventListener("click", () => {
      routeDraft = [];
      renderMapEditor();
      setEditorInfo("已清除路線暫選。");
    });
    mapEditorCanvas.addEventListener("click", handleMapEditorClick);
    document.querySelector("#exportScopeButton").addEventListener("click", async () => {
      await runAdminAction("已匯出", async () => {
        const mapId = mapSelect.value;
        const floorId = floorSelect.value;
        const data = await getJson(`/api/data/export?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `indoor-navigation-${mapId}-${floorId}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
      });
    });
    document.querySelector("#evaluateFeedbackButton").addEventListener("click", async () => {
      await runAdminAction("評估完成", async () => {
        await postJson("/api/navigation-feedback/evaluate", {});
        await loadDashboard();
      });
    });
    document.querySelector("#retrainFeedbackButton").addEventListener("click", async () => {
      await runAdminAction("訓練完成", async () => {
        await postJson("/api/models/retrain-from-feedback", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
        });
        await loadDashboard();
      });
    });
    document.querySelector("#trainKnnButton").addEventListener("click", async () => {
      await runAdminAction("訓練完成", async () => {
        await postJson("/api/models/train", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
          algorithm: "knn",
          activate: true,
        });
        await loadDashboard();
      });
    });
    document.querySelector("#trainRfButton").addEventListener("click", async () => {
      await runAdminAction("已建立", async () => {
        await postJson("/api/models/train", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
          algorithm: "randomForest",
          activate: false,
        });
        await loadDashboard();
      });
    });
    document.querySelector("#trainPolicyButton").addEventListener("click", async () => {
      await runAdminAction("訓練完成", async () => {
        await postJson("/api/navigation-policy/train", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
          trainingEpisodes: 100,
        });
        await loadDashboard();
      });
    });
    document.querySelector("#createMapButton").addEventListener("click", async () => {
      const name = document.querySelector("#newMapName").value.trim();
      await runAdminAction("已新增地圖", async () => {
        await postJson("/api/maps", { name, description: "" });
        await init();
      });
    });
    document.querySelector("#createFloorButton").addEventListener("click", async () => {
      const floorName = document.querySelector("#newFloorName").value.trim();
      await runAdminAction("已新增樓層", async () => {
        await postJson("/api/floors", {
          mapId: mapSelect.value,
          floorName,
          floorLevel: floorSelect.options.length + 1,
          width: 1200,
          height: 800,
          scale: 1,
        });
        await loadFloors();
        await loadDashboard();
      });
    });
    document.querySelector("#createPlaceButton").addEventListener("click", async () => {
      const name = document.querySelector("#newPlaceName").value.trim();
      const category = document.querySelector("#newPlaceCategory").value.trim() || "未分類";
      const keywords = document.querySelector("#newPlaceKeywords").value.trim();
      const description = document.querySelector("#newPlaceDescription").value.trim();
      const x = Number(document.querySelector("#newPlaceX").value);
      const y = Number(document.querySelector("#newPlaceY").value);
      await runAdminAction("已新增地點", async () => {
        await postJson("/api/places", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
          name,
          category,
          x,
          y,
          description,
          keywords,
          searchable: true,
        });
        document.querySelector("#placeEditorForm").classList.add("hidden");
        document.querySelector("#newPlaceName").value = "";
        document.querySelector("#newPlaceCategory").value = "";
        document.querySelector("#newPlaceKeywords").value = "";
        document.querySelector("#newPlaceDescription").value = "";
        await loadDashboard();
      });
    });
    document.querySelector("#testLibraryRouteButton").addEventListener("click", async () => {
      const place = currentPlaces.find(item => item.floorId === floorSelect.value) || currentPlaces[0];
      if (!place) {
        document.querySelector("#routeTestResult").textContent = "目前沒有可測試的地點。";
        return;
      }
      await testRoute(place.id, place.floorId);
    });
    document.querySelector("#testSecondFloorRouteButton").addEventListener("click", async () => {
      const place = currentPlaces.find(item => item.floorId !== floorSelect.value);
      if (!place) {
        document.querySelector("#routeTestResult").textContent = "目前沒有其他樓層的地點可測試。";
        return;
      }
      await testRoute(place.id, place.floorId);
    });
    mapSelect.addEventListener("change", async () => {
      await loadFloors();
      await loadDashboard();
    });
    floorSelect.addEventListener("change", loadDashboard);

    init();

    async function init() {
      const maps = await getJson("/api/maps");
      mapSelect.innerHTML = maps.map(map => `<option value="${escapeHtml(map.id)}">${escapeHtml(map.name)}</option>`).join("");
      await loadFloors();
      await loadHealth();
      await loadDashboard();
    }

    async function loadHealth() {
      const health = await getJson("/api/health");
      document.querySelector("#healthInfo").textContent = `後端：正常`;
    }

    async function loadFloors() {
      const mapId = mapSelect.value;
      const floors = await getJson(`/api/floors?mapId=${encodeURIComponent(mapId)}`);
      currentFloors = floors;
      floorSelect.innerHTML = floors.map(floor => `<option value="${escapeHtml(floor.id)}">${escapeHtml(floor.floorName)}</option>`).join("");
    }

    async function loadDashboard() {
      const mapId = mapSelect.value;
      const floorId = floorSelect.value;
      const [places, summary, points, quality, routeEdges, routeNodes, feedback, models, jobs, policyRuns, policyLogs, reports] = await Promise.all([
        getJson(`/api/places?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/wifi-scans/summary?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/wifi-scans/points?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/wifi-scans/quality?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/route-edges?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/route-nodes?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/navigation-feedback/quality-summary?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/models?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/model-training-jobs?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/navigation-policy/runs?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/navigation-policy/logs?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
        getJson(`/api/user-reports?mapId=${encodeURIComponent(mapId)}&floorId=${encodeURIComponent(floorId)}`),
      ]);
      currentPlaces = places;
      currentPoints = Array.isArray(points.points) ? points.points : [];
      currentRouteEdges = routeEdges;
      currentRouteNodes = routeNodes;
      await loadMapEditorImage();

      document.querySelector("#placesBody").innerHTML = places.map(place => `
        <tr>
          <td>${escapeHtml(place.name)}</td>
          <td>${escapeHtml(place.category)}</td>
          <td>${place.x}, ${place.y}</td>
          <td>
            <select data-place-status="${escapeHtml(place.id)}">
              ${["open", "closed", "suspended", "unset"].map(status => `<option value="${status}" ${place.businessStatus === status ? "selected" : ""}>${statusText(status)}</option>`).join("")}
            </select>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="muted">目前沒有地點資料</td></tr>`;
      document.querySelectorAll("[data-place-status]").forEach(select => {
        select.addEventListener("change", async () => {
          await postJson("/api/places/status", {
            placeId: select.getAttribute("data-place-status"),
            businessStatus: select.value,
          });
          await loadDashboard();
        });
      });

      document.querySelector("#totalRecords").textContent = summary.totalRecords;
      document.querySelector("#pointCount").textContent = summary.pointCount;
      document.querySelector("#bssidCount").textContent = summary.bssidCount;

      document.querySelector("#pointsBody").innerHTML = points.points.map(point => `
        <tr>
          <td>${escapeHtml(point.pointId)}</td>
          <td>${point.x}, ${point.y}</td>
          <td>${point.scanCount}</td>
          <td>${point.bssidCount}</td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="muted">目前沒有 Wi-Fi 採樣點</td></tr>`;

      document.querySelector("#qualityBody").innerHTML = quality.items.map(item => `
        <tr>
          <td>${escapeHtml(item.name)}</td>
          <td class="${item.level === "bad" ? "bad" : item.level === "warn" ? "warn" : ""}">${escapeHtml(item.message)}</td>
          <td>${escapeHtml(item.action || "-")}</td>
        </tr>
      `).join("");

      document.querySelector("#routeEdgesBody").innerHTML = routeEdges.map(edge => `
        <tr>
          <td>${escapeHtml(edge.fromNodeId)} -> ${escapeHtml(edge.toNodeId)}</td>
          <td>${edge.distance}</td>
          <td>${edge.isBlocked ? "封鎖" : "可通行"}</td>
          <td><button data-route-edge="${escapeHtml(edge.id)}" data-blocked="${edge.isBlocked ? "false" : "true"}">${edge.isBlocked ? "解除" : "封鎖"}</button></td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="muted">目前沒有路段資料</td></tr>`;
      document.querySelectorAll("[data-route-edge]").forEach(button => {
        button.addEventListener("click", async () => {
          await runAdminAction("已更新路段狀態", async () => {
            await postJson("/api/route-edges/block", {
              edgeId: button.getAttribute("data-route-edge"),
              isBlocked: button.getAttribute("data-blocked") === "true",
            });
            await loadDashboard();
          });
        });
      });

      document.querySelector("#scopeInfo").textContent = `地圖：${mapId}，樓層：${floorId}`;
      document.querySelector("#pendingFeedback").textContent = feedback.pendingCount;
      document.querySelector("#highFeedback").textContent = feedback.highConfidenceCount;
      document.querySelector("#rejectedFeedback").textContent = feedback.rejectedCount;
      document.querySelector("#modelsBody").innerHTML = models.map(model => `
        <tr>
          <td>${escapeHtml(model.versionName)}</td>
          <td>${escapeHtml(model.algorithm)}</td>
          <td>${model.trainingDataCount}</td>
          <td>${model.isComparisonOnly ? "比較模型" : "主定位模型"}</td>
          <td>${model.isActive ? "啟用" : "未啟用"}</td>
          <td>${model.isActive || model.isComparisonOnly ? "" : `<button data-activate-model="${escapeHtml(model.id)}">啟用</button>`}</td>
        </tr>
      `).join("") || `<tr><td colspan="6" class="muted">目前沒有模型版本</td></tr>`;
      document.querySelectorAll("[data-activate-model]").forEach(button => {
        button.addEventListener("click", async () => {
          await runAdminAction("已切換啟用模型", async () => {
            await postJson("/api/models/activate", { modelVersionId: button.getAttribute("data-activate-model") });
            await loadDashboard();
          });
        });
      });
      document.querySelector("#jobsBody").innerHTML = jobs.map(job => `
        <tr>
          <td>${trainingTypeText(job.trainingType)}</td>
          <td>${job.status}</td>
          <td>人工 ${job.trainingDataCount}，回饋 ${job.feedbackDataCount}</td>
        </tr>
      `).join("") || `<tr><td colspan="3" class="muted">目前沒有訓練紀錄</td></tr>`;
      document.querySelector("#policyRunsBody").innerHTML = policyRuns.map(run => `
        <tr>
          <td>${run.trainingEpisodes}</td>
          <td>${run.averageReward ?? "-"}</td>
          <td>${run.successRate ?? "-"}</td>
          <td>${escapeHtml(run.simulationSummary || "-")}</td>
          <td>${run.isActive ? "啟用" : "未啟用"}</td>
        </tr>
      `).join("") || `<tr><td colspan="5" class="muted">目前沒有策略版本</td></tr>`;
      document.querySelector("#policyLogsBody").innerHTML = policyLogs.map(log => `
        <tr>
          <td>${policyActionText(log.recommendedAction)}</td>
          <td>${log.wifiConfidence}</td>
          <td>${log.isOffRoute ? "偏離路線" : log.obstacleNearby ? "有障礙" : "一般"}</td>
        </tr>
      `).join("") || `<tr><td colspan="3" class="muted">目前沒有策略決策紀錄</td></tr>`;
      document.querySelector("#reportsBody").innerHTML = reports.map(report => `
        <tr>
          <td>${reportTypeText(report.reportType)}</td>
          <td>${escapeHtml(report.status)}</td>
          <td>${escapeHtml(report.description || "-")}</td>
        </tr>
      `).join("") || `<tr><td colspan="3" class="muted">目前沒有使用者回報</td></tr>`;
    }

    async function loadMapEditorImage() {
      const floor = currentFloors.find(item => item.id === floorSelect.value);
      mapEditorImage = null;
      mapEditorBounds = null;
      if (!floor?.imageUrl) {
        renderMapEditor();
        setEditorInfo("目前樓層沒有地圖圖片。");
        return;
      }
      await new Promise((resolve) => {
        const image = new Image();
        image.onload = () => {
          mapEditorImage = image;
          renderMapEditor();
          resolve();
        };
        image.onerror = () => {
          renderMapEditor();
          setEditorInfo("地圖圖片載入失敗。");
          resolve();
        };
        image.src = `${floor.imageUrl}?v=${encodeURIComponent(floor.updatedAt || "")}`;
      });
    }

    function renderMapEditor() {
      const ratio = window.devicePixelRatio || 1;
      const rect = mapEditorCanvas.getBoundingClientRect();
      mapEditorCanvas.width = Math.max(1, Math.round(rect.width * ratio));
      mapEditorCanvas.height = Math.max(1, Math.round(rect.height * ratio));
      mapEditorCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      mapEditorCtx.clearRect(0, 0, rect.width, rect.height);
      mapEditorCtx.fillStyle = "#eef1f4";
      mapEditorCtx.fillRect(0, 0, rect.width, rect.height);
      if (!mapEditorImage) return;

      const bounds = containRect(rect.width, rect.height, mapEditorImage.naturalWidth, mapEditorImage.naturalHeight);
      mapEditorBounds = bounds;
      mapEditorCtx.drawImage(mapEditorImage, bounds.x, bounds.y, bounds.width, bounds.height);
      drawRouteSegments(bounds);
      drawRouteNodes(bounds);
      drawWifiPoints(bounds);
      drawPlaces(bounds);
      drawRouteDraft(bounds);
    }

    function drawRouteSegments(bounds) {
      const nodes = new Map(currentRouteNodes.map(node => [node.id, node]));
      mapEditorCtx.lineWidth = 1;
      mapEditorCtx.strokeStyle = "#2563eb";
      mapEditorCtx.lineCap = "round";
      currentRouteEdges.filter(edge => edge.isBlocked !== true).forEach(edge => {
        const from = nodes.get(edge.fromNodeId);
        const to = nodes.get(edge.toNodeId);
        if (!from || !to) return;
        mapEditorCtx.beginPath();
        mapEditorCtx.moveTo(mapToCanvasX(from.x, bounds), mapToCanvasY(from.y, bounds));
        mapEditorCtx.lineTo(mapToCanvasX(to.x, bounds), mapToCanvasY(to.y, bounds));
        mapEditorCtx.stroke();
      });
    }

    function drawRouteNodes(bounds) {
      currentRouteNodes.forEach(node => {
        const x = mapToCanvasX(node.x, bounds);
        const y = mapToCanvasY(node.y, bounds);
        mapEditorCtx.fillStyle = node.source === "admin" ? "#f59e0b" : "#64748b";
        mapEditorCtx.beginPath();
        mapEditorCtx.arc(x, y, node.source === "admin" ? 4 : 3, 0, Math.PI * 2);
        mapEditorCtx.fill();
      });
    }

    function drawWifiPoints(bounds) {
      mapEditorCtx.fillStyle = "rgba(20,108,99,0.7)";
      currentPoints.forEach(point => {
        mapEditorCtx.beginPath();
        mapEditorCtx.arc(mapToCanvasX(point.x, bounds), mapToCanvasY(point.y, bounds), 4, 0, Math.PI * 2);
        mapEditorCtx.fill();
      });
    }

    function drawPlaces(bounds) {
      mapEditorCtx.font = "13px Microsoft JhengHei, sans-serif";
      currentPlaces.forEach(place => {
        const x = mapToCanvasX(place.x, bounds);
        const y = mapToCanvasY(place.y, bounds);
        mapEditorCtx.fillStyle = "#dc2626";
        mapEditorCtx.beginPath();
        mapEditorCtx.arc(x, y, 6, 0, Math.PI * 2);
        mapEditorCtx.fill();
        mapEditorCtx.fillStyle = "#111827";
        mapEditorCtx.fillText(place.name, x + 8, y - 8);
      });
    }

    function drawRouteDraft(bounds) {
      if (routeDraft.length === 0) return;
      mapEditorCtx.fillStyle = "#f59e0b";
      routeDraft.forEach(point => {
        mapEditorCtx.beginPath();
        mapEditorCtx.arc(mapToCanvasX(point.x, bounds), mapToCanvasY(point.y, bounds), 7, 0, Math.PI * 2);
        mapEditorCtx.fill();
      });
    }

    async function handleMapEditorClick(event) {
      if (!mapEditorBounds || !mapEditorImage) return;
      const rect = mapEditorCanvas.getBoundingClientRect();
      const canvasX = event.clientX - rect.left;
      const canvasY = event.clientY - rect.top;
      const point = canvasToMapPoint(canvasX, canvasY, mapEditorBounds);
      if (!point) return;
      document.querySelector("#newPlaceX").value = point.x.toFixed(1);
      document.querySelector("#newPlaceY").value = point.y.toFixed(1);
      if (editorMode === "place") {
        document.querySelector("#placeEditorForm").classList.remove("hidden");
        setEditorInfo(`已選座標：${point.x.toFixed(1)}, ${point.y.toFixed(1)}，填資料後按儲存標點。`);
        return;
      }
      if (editorMode === "deleteNode") {
        const node = nearestRouteNode(point);
        if (!node) {
          setEditorInfo("附近沒有可刪除的後台節點。");
          return;
        }
        await runAdminAction("已刪除節點", async () => {
          await deleteJson(`/api/route-nodes?nodeId=${encodeURIComponent(node.id)}`);
          await loadDashboard();
        });
        return;
      }
      if (editorMode === "deleteEdge") {
        const edge = nearestRouteEdge(point);
        if (!edge) {
          setEditorInfo("附近沒有路線可刪除。");
          return;
        }
        await runAdminAction(edge.source === "admin" ? "已刪除路線" : "已封鎖內建路線", async () => {
          await deleteJson(`/api/route-edges?edgeId=${encodeURIComponent(edge.id)}`);
          await loadDashboard();
        });
        return;
      }
      routeDraft.push(point);
      if (routeDraft.length < 2) {
        renderMapEditor();
        setEditorInfo("已選路線起點，請再點終點。");
        return;
      }
      const [from, to] = routeDraft;
      await runAdminAction("已新增路段", async () => {
        await postJson("/api/route-segments", {
          mapId: mapSelect.value,
          floorId: floorSelect.value,
          from,
          to,
          name: document.querySelector("#newPlaceDescription").value.trim(),
        });
        routeDraft = [];
        await loadDashboard();
      });
    }

    function setEditorMode(mode) {
      editorMode = mode;
      routeDraft = [];
      document.querySelector("#placeEditorForm").classList.add("hidden");
      [
        ["placeModeButton", "place"],
        ["routeModeButton", "route"],
        ["deleteNodeModeButton", "deleteNode"],
        ["deleteEdgeModeButton", "deleteEdge"],
      ].forEach(([id, value]) => {
        document.querySelector(`#${id}`).classList.toggle("active", mode === value);
        document.querySelector(`#${id}`).classList.toggle("secondary", mode !== value);
      });
      renderMapEditor();
      const messages = {
        place: "按標點後點一下地圖，才會出現名稱、關鍵詞、分類設施、備註。",
        route: "點兩個可走位置建立路段。",
        deleteNode: "點後台新增的節點即可刪除。",
        deleteEdge: "點路線即可刪除；內建路線會改成封鎖。",
      };
      setEditorInfo(messages[mode] || "");
    }

    function setEditorInfo(message) {
      document.querySelector("#mapEditorInfo").textContent = message;
    }

    function nearestRouteNode(point) {
      return currentRouteNodes
        .filter(node => node.source === "admin")
        .map(node => ({ ...node, hitDistance: distance(point.x, point.y, node.x, node.y) }))
        .filter(node => node.hitDistance <= 20)
        .sort((left, right) => left.hitDistance - right.hitDistance)[0] || null;
    }

    function nearestRouteEdge(point) {
      const nodes = new Map(currentRouteNodes.map(node => [node.id, node]));
      return currentRouteEdges
        .map(edge => {
          const from = nodes.get(edge.fromNodeId);
          const to = nodes.get(edge.toNodeId);
          if (!from || !to) return null;
          return {
            ...edge,
            hitDistance: distanceToSegment(point, from, to),
          };
        })
        .filter(edge => edge && edge.hitDistance <= 16)
        .sort((left, right) => left.hitDistance - right.hitDistance)[0] || null;
    }

    function distanceToSegment(point, from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (dx === 0 && dy === 0) return distance(point.x, point.y, from.x, from.y);
      const t = Math.max(0, Math.min(1, ((point.x - from.x) * dx + (point.y - from.y) * dy) / (dx * dx + dy * dy)));
      return distance(point.x, point.y, from.x + t * dx, from.y + t * dy);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(Number(ax) - Number(bx), Number(ay) - Number(by));
    }

    function containRect(containerWidth, containerHeight, imageWidth, imageHeight) {
      const scale = Math.min(containerWidth / imageWidth, containerHeight / imageHeight);
      const width = imageWidth * scale;
      const height = imageHeight * scale;
      return {
        x: (containerWidth - width) / 2,
        y: (containerHeight - height) / 2,
        width,
        height,
      };
    }

    function canvasToMapPoint(canvasX, canvasY, bounds) {
      if (canvasX < bounds.x || canvasY < bounds.y || canvasX > bounds.x + bounds.width || canvasY > bounds.y + bounds.height) return null;
      const floor = currentFloors.find(item => item.id === floorSelect.value) || {};
      const width = Number(floor.width || floor.imageNaturalWidth || mapEditorImage.naturalWidth);
      const height = Number(floor.height || floor.imageNaturalHeight || mapEditorImage.naturalHeight);
      return {
        x: ((canvasX - bounds.x) / bounds.width) * width,
        y: ((canvasY - bounds.y) / bounds.height) * height,
      };
    }

    function mapToCanvasX(x, bounds) {
      const floor = currentFloors.find(item => item.id === floorSelect.value) || {};
      const width = Number(floor.width || floor.imageNaturalWidth || mapEditorImage.naturalWidth);
      return bounds.x + (Number(x) / width) * bounds.width;
    }

    function mapToCanvasY(y, bounds) {
      const floor = currentFloors.find(item => item.id === floorSelect.value) || {};
      const height = Number(floor.height || floor.imageNaturalHeight || mapEditorImage.naturalHeight);
      return bounds.y + (Number(y) / height) * bounds.height;
    }

    async function getJson(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function postJson(path, payload) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || `HTTP ${response.status}`);
      }
      return response.json();
    }

    async function deleteJson(path) {
      const response = await fetch(path, { method: "DELETE" });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || `HTTP ${response.status}`);
      }
      return response.json();
    }

    async function runAdminAction(successMessage, action) {
      const notice = document.querySelector("#adminNotice");
      notice.textContent = "處理中";
      notice.className = "muted";
      try {
        await action();
        notice.textContent = successMessage;
        notice.className = "muted";
      } catch (error) {
        notice.textContent = `失敗：${error.message}`;
        notice.className = "bad";
      }
    }

    async function testRoute(destinationPlaceId, targetFloorId) {
      const result = await postJson("/api/routes", {
        mapId: mapSelect.value,
        startFloorId: floorSelect.value,
        targetFloorId,
        startX: 180,
        startY: 620,
        destinationPlaceId,
      });
      const transitionText = result.floorTransitions?.length
        ? `，換樓層：${result.floorTransitions.map(item => item.name).join("、")}`
        : "";
      document.querySelector("#routeTestResult").textContent = `距離 ${result.distance}，預估 ${result.estimatedTime} 分鐘${transitionText}`;
    }

    function statusText(value) {
      return { open: "營業中", closed: "休息中", suspended: "暫停服務", unset: "未設定" }[value] || "未設定";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function trainingTypeText(value) {
      return {
        initialManualFingerprint: "人工初始訓練",
        feedbackIncrementalTraining: "回饋再訓練",
        fullRetraining: "完整再訓練",
      }[value] || value;
    }

    function policyActionText(value) {
      return {
        continueNavigation: "繼續導航",
        reroute: "重新規劃",
        relocalize: "重新定位",
        guideBackToRoute: "導回路線",
        useElevator: "使用電梯",
        useStairs: "使用樓梯",
      }[value] || value;
    }

    function reportTypeText(value) {
      return {
        blockedRoute: "路線不通",
        closedPlace: "地點關閉",
        obstacle: "障礙物",
        wrongPlace: "地點錯誤",
      }[value] || value;
    }
  </script>
</body>
</html>
