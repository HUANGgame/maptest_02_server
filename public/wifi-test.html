<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wi-Fi 定位測試</title>
  <style>
    :root {
      color-scheme: light;
      --text: #17212f;
      --muted: #667085;
      --line: #d9dee7;
      --primary: #2f6fed;
      --surface: #ffffff;
      --page: #f5f6f8;
      --ok: #1f7a55;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-top: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      padding: 11px 12px;
      background: #fff;
    }
    textarea {
      min-height: 260px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button, a.button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      color: var(--text);
      text-decoration: none;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: var(--text);
    }
    .status {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    @media (max-width: 640px) {
      h1 { font-size: 24px; }
      button, a.button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Wi-Fi 定位測試</h1>
    <p>貼上 BSSID 對 RSSI 的 JSON 字典，送到測試模型，檢查是否能回傳 [Y, X] 座標。</p>

    <section class="panel">
      <label for="modelUrl">模型網址</label>
      <input id="modelUrl" value="https://mxz0qz8w-8000.jpe1.devtunnels.ms/predict" autocomplete="off">
    </section>

    <section class="panel">
      <label for="signals">Wi-Fi 訊號 JSON</label>
      <textarea id="signals">{
  "00:11:22:33:44:55": -55,
  "66:77:88:99:aa:bb": -72
}</textarea>
      <div class="actions">
        <button class="primary" id="send">送出測試</button>
        <button id="sampleObject">字典範例</button>
        <button id="sampleArray">掃描陣列範例</button>
        <a class="button" href="/">回用戶端</a>
        <a class="button" href="/admin">回後台</a>
      </div>
    </section>

    <section class="panel">
      <div id="status" class="status">尚未測試</div>
      <pre id="result">結果會顯示在這裡。</pre>
    </section>
  </main>

  <script>
    const modelUrlInput = document.querySelector("#modelUrl");
    const signalsInput = document.querySelector("#signals");
    const statusEl = document.querySelector("#status");
    const resultEl = document.querySelector("#result");

    document.querySelector("#sampleObject").addEventListener("click", () => {
      signalsInput.value = JSON.stringify({
        "00:11:22:33:44:55": -55,
        "66:77:88:99:aa:bb": -72
      }, null, 2);
    });

    document.querySelector("#sampleArray").addEventListener("click", () => {
      signalsInput.value = JSON.stringify([
        { bssid: "00:11:22:33:44:55", ssid: "demo-ap", rssi: -55 },
        { bssid: "66:77:88:99:aa:bb", ssid: "demo-ap-2", rssi: -72 }
      ], null, 2);
    });

    document.querySelector("#send").addEventListener("click", async () => {
      statusEl.className = "status";
      statusEl.textContent = "測試中...";
      resultEl.textContent = "";

      let signals;
      try {
        signals = normalizeSignals(JSON.parse(signalsInput.value));
        if (Object.keys(signals).length === 0) throw new Error("沒有可用的 BSSID/RSSI 資料");
      } catch (error) {
        statusEl.className = "status bad";
        statusEl.textContent = "JSON 格式錯誤";
        resultEl.textContent = error.message;
        return;
      }

      try {
        const response = await fetch("/api/dev-predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            modelUrl: modelUrlInput.value.trim(),
            signals
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || `HTTP ${response.status}`);
        }
        statusEl.className = "status ok";
        statusEl.textContent = `預測座標 [Y, X]：${JSON.stringify(data.location)}`;
        resultEl.textContent = JSON.stringify(data.raw, null, 2);
      } catch (error) {
        statusEl.className = "status bad";
        statusEl.textContent = "測試失敗";
        resultEl.textContent = error.message;
      }
    });

    function normalizeSignals(input) {
      if (Array.isArray(input)) {
        return input.reduce((signals, item) => {
          const bssid = String(item && item.bssid || "").trim().toLowerCase();
          const rssi = Number(item && item.rssi);
          if (bssid && Number.isFinite(rssi)) signals[bssid] = rssi;
          return signals;
        }, {});
      }
      if (input && typeof input === "object") {
        return Object.entries(input).reduce((signals, [bssid, rssi]) => {
          const key = String(bssid || "").trim().toLowerCase();
          const value = Number(rssi);
          if (key && Number.isFinite(value)) signals[key] = value;
          return signals;
        }, {});
      }
      return {};
    }
  </script>
</body>
</html>
