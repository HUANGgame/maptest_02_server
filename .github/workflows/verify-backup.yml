name: verify-backup-branch

permissions:
  contents: write

on:
  push:
    branches:
      - backup-stinnnnn-20261106
    paths:
      - "app_v4_integrated.py"
      - "public/index_dqn_integrated_pdr_test_v19_idcompat.html"
      - "android/IndoorNavigation/**"
      - "render.yaml"
      - ".github/workflows/verify-backup.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python syntax
        run: python -m py_compile app_v4_integrated.py wifi_locator_v3.py wifi_locator_v4.py route_safe_engine.py anchor_to_dqn.py

      - name: Verify removed grid and mission UI
        run: |
          ! grep -q 'id="gridOverlayButton"' public/index_dqn_integrated_pdr_test_v19_idcompat.html
          ! grep -q 'const GRID_DATA' public/index_dqn_integrated_pdr_test_v19_idcompat.html
          ! grep -qiE '寶藏|每日任務|treasure|daily[ _-]?(mission|task)' public/index_dqn_integrated_pdr_test_v19_idcompat.html

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("public/index_dqn_integrated_pdr_test_v19_idcompat.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.I)
          out = pathlib.Path("/tmp/js-check")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"extracted {len(scripts)} scripts")
          PY
          for f in /tmp/js-check/*.js; do node --check "$f"; done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android debug APK
        working-directory: android/IndoorNavigation
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish test APK to backup branch
        run: |
          cp android/IndoorNavigation/app/build/outputs/apk/debug/app-debug.apk public/NaviTaipei_BACKUP_TEST_v1.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/NaviTaipei_BACKUP_TEST_v1.1.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish backup test APK v1.1"
            git push
          fi
